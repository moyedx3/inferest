[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.33"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
arbitrum = "${ARBITRUM_RPC_URL}"

[fuzz]
runs = 256

# Foundry's lint pass does not resolve the lib/octant-v2-core/:src/= context remapping, so linting is skipped on build (still available with `forge lint`).
[lint]
lint_on_build = false
